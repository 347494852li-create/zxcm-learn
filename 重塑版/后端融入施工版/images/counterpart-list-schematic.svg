<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .card { fill:#ffffff; stroke:#e4e7ed; stroke-width:1; }
      .text { fill:#303133; font-size:13px; }
      .muted { fill:#909399; font-size:12px; }
      .th { fill:#606266; font-size:12px; font-weight:600; }
      .td { fill:#606266; font-size:12px; }
      .sidebar-text { fill:#bfcbd9; font-size:13px; }
      .sidebar-active { fill:#ffffff; font-size:13px; font-weight:600; }
      .btn-text { fill:#ffffff; font-size:12px; }
      .btn-default-text { fill:#606266; font-size:12px; }
      .dash { stroke:#409eff; stroke-width:1.4; stroke-dasharray:6 4; fill:none; }
      .badge-text { fill:#ffffff; font-size:11px; font-weight:700; }
      .tip { fill:#409eff; font-size:12px; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" rx="10" fill="#ffffff" stroke="#dcdfe6"/>
  <rect x="0" y="0" width="1200" height="52" fill="#ffffff"/>
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#e4e7ed"/>
  <circle cx="28" cy="26" r="11" fill="#409eff"/>
  <text x="28" y="30" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">肇</text>
  <text x="48" y="31" class="text" font-weight="600">肇新合同管理系统</text>
  <text x="1100" y="31" class="muted">管理员</text>
  <circle cx="1156" cy="26" r="13" fill="#e4e7ed"/>
  <text x="1156" y="31" text-anchor="middle" class="muted">A</text>

  <rect x="0" y="52" width="190" height="668" fill="#304156"/>
  <text x="18" y="80" fill="#8797a6" font-size="11">合同基础配置</text>
  <text x="22" y="112" class="sidebar-text">签约主体</text>
  <rect x="8" y="124" width="174" height="30" rx="4" fill="#263445"/>
  <rect x="8" y="124" width="4" height="30" fill="#409eff"/>
  <text x="22" y="144" class="sidebar-active">合作方管理</text>
  <text x="22" y="182" class="sidebar-text">编号规则</text>
  <text x="22" y="218" class="sidebar-text">合同类型</text>
  <text x="22" y="254" class="sidebar-text">合同管理</text>
  <text x="22" y="290" class="sidebar-text">模板管理</text>

  <rect x="190" y="52" width="1010" height="668" fill="#f5f7fa"/>
  <text x="214" y="82" class="muted">合作方管理 / 合作方列表</text>

  <!-- 搜索区 -->
  <rect x="210" y="96" width="966" height="84" rx="6" class="card"/>
  <text x="228" y="118" class="muted">相对方名称</text>
  <rect x="228" y="126" width="200" height="30" rx="4" fill="#fff" stroke="#dcdfe6"/>
  <text x="238" y="146" class="muted">请输入名称</text>
  <text x="448" y="118" class="muted">统一社会信用代码</text>
  <rect x="448" y="126" width="220" height="30" rx="4" fill="#fff" stroke="#dcdfe6"/>
  <text x="458" y="146" class="muted">请输入信用代码</text>
  <text x="688" y="118" class="muted">企业类型</text>
  <rect x="688" y="126" width="150" height="30" rx="4" fill="#fff" stroke="#dcdfe6"/>
  <text x="698" y="146" class="muted">请选择</text>
  <rect x="862" y="126" width="66" height="30" rx="4" fill="#409eff"/>
  <text x="895" y="146" text-anchor="middle" class="btn-text">搜索</text>
  <rect x="938" y="126" width="66" height="30" rx="4" fill="#fff" stroke="#dcdfe6"/>
  <text x="971" y="146" text-anchor="middle" class="btn-default-text">重置</text>

  <!-- 工具栏 -->
  <rect x="210" y="196" width="66" height="28" rx="4" fill="#409eff"/>
  <text x="243" y="215" text-anchor="middle" class="btn-text">新增</text>
  <rect x="286" y="196" width="66" height="28" rx="4" fill="#fff" stroke="#dcdfe6"/>
  <text x="319" y="215" text-anchor="middle" class="btn-default-text">导入</text>
  <rect x="362" y="196" width="66" height="28" rx="4" fill="#fff" stroke="#dcdfe6"/>
  <text x="395" y="215" text-anchor="middle" class="btn-default-text">导出</text>

  <!-- 表格 -->
  <rect x="210" y="236" width="966" height="360" rx="6" class="card"/>
  <rect x="210" y="236" width="966" height="38" rx="6" fill="#fafafa"/>
  <line x1="210" y1="274" x2="1176" y2="274" stroke="#ebeef5"/>
  <text x="226" y="260" class="th">相对方名称</text>
  <text x="376" y="260" class="th">统一社会信用代码</text>
  <text x="566" y="260" class="th">企业类型</text>
  <text x="676" y="260" class="th">经营状态</text>
  <text x="776" y="260" class="th">负责人</text>
  <text x="906" y="260" class="th">可用状态</text>
  <text x="1016" y="260" class="th">操作</text>

  <text x="226" y="310" class="td">测试合作方</text>
  <text x="376" y="310" class="td">—</text>
  <text x="566" y="310" class="td">企业</text>
  <text x="676" y="310" class="td">正常</text>
  <text x="776" y="310" class="td" fill="#409eff">张三</text>
  <rect x="906" y="298" width="36" height="16" rx="8" fill="#67c23a"/>
  <circle cx="933" cy="306" r="6" fill="#fff"/>
  <text x="950" y="311" class="muted">可用</text>
  <text x="1016" y="310" class="td" fill="#409eff">修改</text>
  <text x="1060" y="310" class="td" fill="#f56c6c">删除</text>
  <line x1="210" y1="330" x2="1176" y2="330" stroke="#ebeef5"/>

  <text x="700" y="410" text-anchor="middle" class="muted">（列表只返回「负责人 = 当前登录人」或「在我数据范围内」的行）</text>

  <!-- 分页 -->
  <text x="980" y="626" class="muted">共 1 条</text>
  <rect x="1040" y="610" width="70" height="26" rx="4" fill="#fff" stroke="#dcdfe6"/>
  <text x="1075" y="627" text-anchor="middle" class="muted">10 条/页</text>
  <rect x="1120" y="610" width="26" height="26" rx="4" fill="#fff" stroke="#dcdfe6"/>
  <text x="1133" y="627" text-anchor="middle" class="muted">‹</text>
  <rect x="1150" y="610" width="26" height="26" rx="4" fill="#409eff"/>
  <text x="1163" y="627" text-anchor="middle" class="btn-text">1</text>

  <!-- 数据权限标注 -->
  <rect x="766" y="246" width="70" height="92" rx="6" class="dash"/>
  <circle cx="766" cy="246" r="11" fill="#409eff"/>
  <text x="766" y="250" text-anchor="middle" class="badge-text">1</text>
  <text x="830" y="356" class="tip">数据权限锚点：负责人</text>

  <!-- 图例 -->
  <rect x="210" y="646" width="966" height="58" rx="6" fill="#fff" stroke="#e4e7ed"/>
  <text x="226" y="668" class="text" font-weight="600">图例</text>
  <text x="226" y="690" class="muted">1 负责人列 = 数据权限锚点（contract_counterpart_head）</text>
  <text x="620" y="690" class="muted">数据范围由 sys_role.partner_permission 决定</text>
</svg>
