<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .card { fill:#ffffff; stroke:#e4e7ed; stroke-width:1; }
      .text { fill:#303133; font-size:13px; }
      .muted { fill:#909399; font-size:12px; }
      .th { fill:#606266; font-size:12px; font-weight:600; }
      .td { fill:#606266; font-size:12px; }
      .sidebar-text { fill:#bfcbd9; font-size:13px; }
      .sidebar-active { fill:#ffffff; font-size:13px; font-weight:600; }
      .btn-text { fill:#ffffff; font-size:12px; }
      .btn-default-text { fill:#606266; font-size:12px; }
      .badge-text { fill:#ffffff; font-size:11px; font-weight:700; }
      .dash { stroke:#409eff; stroke-width:1.2; stroke-dasharray:5 4; fill:none; opacity:.75; }
    </style>
  </defs>

  <!-- 窗口 -->
  <rect x="0" y="0" width="1280" height="840" rx="10" fill="#ffffff" stroke="#dcdfe6"/>

  <!-- 顶栏 -->
  <rect x="0" y="0" width="1280" height="56" rx="10" fill="#ffffff"/>
  <rect x="0" y="46" width="1280" height="10" fill="#ffffff"/>
  <line x1="0" y1="56" x2="1280" y2="56" stroke="#e4e7ed"/>
  <circle cx="30" cy="28" r="12" fill="#409eff"/>
  <text x="30" y="32" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">肇</text>
  <text x="52" y="33" class="text" font-weight="600">肇新合同管理系统</text>
  <text x="1170" y="33" class="muted">管理员</text>
  <circle cx="1234" cy="28" r="14" fill="#e4e7ed"/>
  <text x="1234" y="33" text-anchor="middle" class="muted">A</text>

  <!-- 左侧菜单 -->
  <rect x="0" y="56" width="210" height="784" fill="#304156"/>
  <text x="20" y="86" fill="#8797a6" font-size="11">合同基础配置</text>

  <rect x="8" y="96" width="194" height="32" rx="4" fill="#263445"/>
  <rect x="8" y="96" width="4" height="32" fill="#409eff"/>
  <text x="24" y="117" class="sidebar-active">签约主体</text>

  <text x="24" y="157" class="sidebar-text">合作方管理</text>
  <text x="24" y="197" class="sidebar-text">合同管理</text>
  <text x="24" y="237" class="sidebar-text">模板管理</text>
  <text x="24" y="277" class="sidebar-text">合同审签</text>
  <text x="24" y="317" class="sidebar-text">统计报表</text>
  <text x="24" y="357" class="sidebar-text">系统监控</text>

  <!-- 主区域背景 -->
  <rect x="210" y="56" width="1070" height="784" fill="#f5f7fa"/>

  <!-- 面包屑 -->
  <text x="236" y="90" class="muted">合同基础配置 / 签约主体</text>

  <!-- ① 搜索区 -->
  <rect x="234" y="104" width="1022" height="96" rx="6" class="card"/>
  <text x="254" y="128" class="muted">签约主体编号</text>
  <rect x="254" y="136" width="190" height="32" rx="4" fill="#ffffff" stroke="#dcdfe6"/>
  <text x="264" y="157" class="muted">请输入编号</text>

  <text x="464" y="128" class="muted">签约主体名称</text>
  <rect x="464" y="136" width="190" height="32" rx="4" fill="#ffffff" stroke="#dcdfe6"/>
  <text x="474" y="157" class="muted">请输入名称</text>

  <text x="674" y="128" class="muted">企业经营状态</text>
  <rect x="674" y="136" width="190" height="32" rx="4" fill="#ffffff" stroke="#dcdfe6"/>
  <text x="684" y="157" class="muted">请选择状态</text>
  <path d="M842 150 l6 6 l6 -6" stroke="#c0c4cc" stroke-width="1.5" fill="none"/>

  <rect x="884" y="136" width="72" height="32" rx="4" fill="#409eff"/>
  <text x="920" y="157" text-anchor="middle" class="btn-text">搜索</text>
  <rect x="966" y="136" width="72" height="32" rx="4" fill="#ffffff" stroke="#dcdfe6"/>
  <text x="1002" y="157" text-anchor="middle" class="btn-default-text">重置</text>

  <!-- ② 工具栏 -->
  <rect x="234" y="216" width="72" height="30" rx="4" fill="#409eff"/>
  <text x="270" y="236" text-anchor="middle" class="btn-text">新增</text>
  <rect x="316" y="216" width="72" height="30" rx="4" fill="#ffffff" stroke="#dcdfe6"/>
  <text x="352" y="236" text-anchor="middle" class="btn-default-text">导入</text>

  <text x="1132" y="236" class="muted">刷新</text>
  <text x="1180" y="236" class="muted">列设置</text>

  <!-- ③ 表格 -->
  <rect x="234" y="260" width="1022" height="400" rx="6" class="card"/>
  <rect x="234" y="260" width="1022" height="40" rx="6" fill="#fafafa"/>
  <rect x="234" y="294" width="1022" height="6" fill="#fafafa"/>
  <line x1="234" y1="300" x2="1256" y2="300" stroke="#ebeef5"/>

  <text x="250" y="285" class="th">序号</text>
  <text x="300" y="285" class="th">签约主体编号</text>
  <text x="450" y="285" class="th">签约主体名称</text>
  <text x="660" y="285" class="th">统一社会信用代码</text>
  <text x="850" y="285" class="th">经营状态</text>
  <text x="940" y="285" class="th">可用状态</text>
  <text x="1060" y="285" class="th">创建时间</text>
  <text x="1170" y="285" class="th">操作</text>

  <!-- 数据行 1（演示数据） -->
  <text x="250" y="330" class="td">1</text>
  <text x="300" y="330" class="td">zxkj</text>
  <text x="450" y="330" class="td">山西肇新科技有限公司</text>
  <text x="660" y="330" class="td">91140105MA0LLW8Q1D</text>
  <text x="850" y="330" class="td">正常</text>

  <!-- ④ 可用状态开关 -->
  <rect x="940" y="316" width="38" height="18" rx="9" fill="#67c23a"/>
  <circle cx="969" cy="325" r="7" fill="#ffffff"/>
  <text x="986" y="330" class="muted">可用</text>

  <text x="1060" y="330" class="td">2026-07-09 14:51</text>
  <text x="1170" y="330" class="td" fill="#409eff">修改</text>
  <text x="1210" y="330" class="td" fill="#f56c6c">删除</text>
  <line x1="234" y1="352" x2="1256" y2="352" stroke="#ebeef5"/>

  <!-- 空状态提示 -->
  <text x="745" y="430" text-anchor="middle" class="muted">（演示数据仅 1 条；新增后表格在这里追加行）</text>

  <!-- ⑤ 分页 -->
  <text x="1046" y="702" class="muted">共 1 条</text>
  <rect x="1106" y="684" width="72" height="26" rx="4" fill="#ffffff" stroke="#dcdfe6"/>
  <text x="1142" y="701" text-anchor="middle" class="muted">10 条/页</text>
  <rect x="1182" y="684" width="26" height="26" rx="4" fill="#ffffff" stroke="#dcdfe6"/>
  <text x="1195" y="701" text-anchor="middle" class="muted">‹</text>
  <rect x="1212" y="684" width="26" height="26" rx="4" fill="#409eff"/>
  <text x="1225" y="701" text-anchor="middle" class="btn-text">1</text>
  <rect x="1242" y="684" width="26" height="26" rx="4" fill="#ffffff" stroke="#dcdfe6"/>
  <text x="1255" y="701" text-anchor="middle" class="muted">›</text>

  <!-- 标注虚线框 -->
  <rect x="228" y="98" width="1034" height="108" rx="8" class="dash"/>
  <rect x="228" y="210" width="170" height="42" rx="6" class="dash"/>
  <rect x="228" y="254" width="1034" height="412" rx="8" class="dash"/>
  <rect x="932" y="308" width="60" height="34" rx="6" class="dash"/>
  <rect x="1024" y="678" width="244" height="40" rx="6" class="dash"/>

  <!-- 标注编号 -->
  <circle cx="228" cy="98" r="12" fill="#409eff"/>
  <text x="228" y="102" text-anchor="middle" class="badge-text">1</text>

  <circle cx="228" cy="210" r="12" fill="#409eff"/>
  <text x="228" y="214" text-anchor="middle" class="badge-text">2</text>

  <circle cx="228" cy="254" r="12" fill="#409eff"/>
  <text x="228" y="258" text-anchor="middle" class="badge-text">3</text>

  <circle cx="924" cy="302" r="12" fill="#409eff"/>
  <text x="924" y="306" text-anchor="middle" class="badge-text">4</text>

  <circle cx="1024" cy="678" r="12" fill="#409eff"/>
  <text x="1024" y="682" text-anchor="middle" class="badge-text">5</text>

  <!-- 图例 -->
  <rect x="234" y="742" width="1022" height="76" rx="6" fill="#ffffff" stroke="#e4e7ed"/>
  <text x="254" y="768" class="text" font-weight="600">图例</text>
  <text x="254" y="794" class="muted">1 搜索区：queryParams（编号/名称/状态）</text>
  <text x="560" y="794" class="muted">2 工具栏：新增 / 导入</text>
  <text x="800" y="794" class="muted">3 表格：signingSubjectList</text>
  <text x="254" y="812" class="muted">4 可用状态开关：调 changeStatus</text>
  <text x="560" y="812" class="muted">5 分页：total 与 pageNum / pageSize</text>
  <text x="900" y="812" class="muted">正式截图后替换本文件即可</text>
</svg>
