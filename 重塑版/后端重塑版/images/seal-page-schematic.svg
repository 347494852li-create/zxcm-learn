<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .card { fill:#ffffff; stroke:#e4e7ed; stroke-width:1; }
      .text { fill:#303133; font-size:13px; }
      .muted { fill:#909399; font-size:12px; }
      .th { fill:#606266; font-size:12px; font-weight:600; }
      .td { fill:#606266; font-size:12px; }
      .sidebar-text { fill:#bfcbd9; font-size:13px; }
      .sidebar-active { fill:#ffffff; font-size:13px; font-weight:600; }
      .btn-text { fill:#ffffff; font-size:12px; }
      .tag { fill:#f0f9eb; stroke:#c2e7b0; }
      .tag-text { fill:#67c23a; font-size:11px; }
      .tag-warn { fill:#fdf6ec; stroke:#f5dab1; }
      .tag-warn-text { fill:#e6a23c; font-size:11px; }
      .dash { stroke:#409eff; stroke-width:1.4; stroke-dasharray:6 4; fill:none; }
      .badge-text { fill:#ffffff; font-size:11px; font-weight:700; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="700" rx="10" fill="#ffffff" stroke="#dcdfe6"/>
  <rect x="0" y="0" width="1200" height="52" fill="#ffffff"/>
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#e4e7ed"/>
  <circle cx="28" cy="26" r="11" fill="#409eff"/>
  <text x="28" y="30" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">肇</text>
  <text x="48" y="31" class="text" font-weight="600">肇新合同管理系统</text>
  <text x="1100" y="31" class="muted">管理员</text>
  <circle cx="1156" cy="26" r="13" fill="#e4e7ed"/>
  <text x="1156" y="31" text-anchor="middle" class="muted">A</text>

  <rect x="0" y="52" width="190" height="648" fill="#304156"/>
  <text x="18" y="80" fill="#8797a6" font-size="11">合同管理</text>
  <text x="22" y="112" class="sidebar-text">合同草拟</text>
  <text x="22" y="148" class="sidebar-text">合同审批</text>
  <text x="22" y="184" class="sidebar-text">模板管理</text>
  <rect x="8" y="196" width="174" height="30" rx="4" fill="#263445"/>
  <rect x="8" y="196" width="4" height="30" fill="#409eff"/>
  <text x="22" y="216" class="sidebar-active">合同台账</text>
  <text x="22" y="254" class="sidebar-text">统计报表</text>

  <rect x="190" y="52" width="1010" height="648" fill="#f5f7fa"/>
  <text x="214" y="82" class="muted">合同管理 / 合同台账</text>

  <!-- 搜索 -->
  <rect x="210" y="96" width="966" height="76" rx="6" class="card"/>
  <text x="228" y="118" class="muted">合同名称</text>
  <rect x="228" y="126" width="200" height="30" rx="4" fill="#fff" stroke="#dcdfe6"/>
  <text x="238" y="146" class="muted">请输入名称</text>
  <text x="448" y="118" class="muted">合同状态</text>
  <rect x="448" y="126" width="150" height="30" rx="4" fill="#fff" stroke="#dcdfe6"/>
  <text x="458" y="146" class="muted">请选择</text>
  <rect x="620" y="126" width="66" height="30" rx="4" fill="#409eff"/>
  <text x="653" y="146" text-anchor="middle" class="btn-text">搜索</text>

  <!-- 表格 -->
  <rect x="210" y="188" width="966" height="400" rx="6" class="card"/>
  <rect x="210" y="188" width="966" height="38" rx="6" fill="#fafafa"/>
  <line x1="210" y1="226" x2="1176" y2="226" stroke="#ebeef5"/>
  <text x="226" y="212" class="th">合同名称</text>
  <text x="386" y="212" class="th">合同编号</text>
  <text x="546" y="212" class="th">合同状态</text>
  <text x="676" y="212" class="th">用印状态</text>
  <text x="806" y="212" class="th">操作</text>

  <text x="226" y="254" class="td">山西肇新采购合同</text>
  <text x="386" y="254" class="td">zxkj-CG-2026-0001</text>
  <rect x="546" y="240" width="72" height="20" rx="4" class="tag"/>
  <text x="582" y="254" text-anchor="middle" class="tag-text">审批通过</text>
  <rect x="676" y="240" width="60" height="20" rx="4" class="tag-warn"/>
  <text x="706" y="254" text-anchor="middle" class="tag-warn-text">待用印</text>
  <text x="806" y="254" class="td" fill="#409eff">申请用印</text>
  <text x="880" y="254" class="td" fill="#409eff">上传双章</text>
  <line x1="210" y1="270" x2="1176" y2="270" stroke="#ebeef5"/>

  <text x="226" y="298" class="td">办公用品采购合同</text>
  <text x="386" y="298" class="td">zxkj-CG-2026-0002</text>
  <rect x="546" y="284" width="72" height="20" rx="4" class="tag"/>
  <text x="582" y="298" text-anchor="middle" class="tag-text">履行中</text>
  <rect x="676" y="284" width="60" height="20" rx="4" class="tag"/>
  <text x="706" y="298" text-anchor="middle" class="tag-text">已用印</text>
  <text x="806" y="298" class="td" fill="#409eff">续签</text>
  <text x="850" y="298" class="td" fill="#409eff">变更</text>
  <text x="894" y="298" class="td" fill="#f56c6c">作废</text>
  <line x1="210" y1="314" x2="1176" y2="314" stroke="#ebeef5"/>

  <text x="226" y="342" class="td">旧版服务合同</text>
  <text x="386" y="342" class="td">zxkj-FW-2026-0003</text>
  <rect x="546" y="328" width="72" height="20" rx="4" class="tag-warn"/>
  <text x="582" y="342" text-anchor="middle" class="tag-warn-text">已作废</text>
  <rect x="676" y="328" width="60" height="20" rx="4" class="tag"/>
  <text x="706" y="342" text-anchor="middle" class="tag-text">已用印</text>
  <text x="806" y="342" class="td" fill="#409eff">查看</text>

  <!-- 说明 -->
  <rect x="210" y="608" width="966" height="76" rx="6" fill="#fff" stroke="#e4e7ed"/>
  <text x="226" y="632" class="text" font-weight="600">图例</text>
  <text x="226" y="654" class="muted">用印 / 作废 / 续签 / 变更都以「合同台账」为入口；动作会同时改合同状态、用印状态，并写事件日志留痕。</text>
  <text x="226" y="674" class="muted">⚠️ 坦白点：归档 / 借阅在当前源码里只有 Service，没有 Controller 和页面（商用版有，开源版裁掉了）。</text>
</svg>
