<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .card { fill:#ffffff; stroke:#e4e7ed; stroke-width:1; }
      .text { fill:#303133; font-size:13px; }
      .muted { fill:#909399; font-size:12px; }
      .th { fill:#606266; font-size:12px; font-weight:600; }
      .td { fill:#606266; font-size:12px; }
      .sidebar-text { fill:#bfcbd9; font-size:13px; }
      .sidebar-active { fill:#ffffff; font-size:13px; font-weight:600; }
      .btn-text { fill:#ffffff; font-size:12px; }
      .btn-default-text { fill:#606266; font-size:12px; }
      .tab { fill:#606266; font-size:13px; }
      .tab-active { fill:#409eff; font-size:13px; font-weight:600; }
      .tag-draft { fill:#fdf6ec; stroke:#f5dab1; }
      .tag-pub { fill:#f0f9eb; stroke:#c2e7b0; }
      .tag-stop { fill:#f4f4f5; stroke:#d3d4d6; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="700" rx="10" fill="#ffffff" stroke="#dcdfe6"/>
  <rect x="0" y="0" width="1200" height="52" fill="#ffffff"/>
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#e4e7ed"/>
  <circle cx="28" cy="26" r="11" fill="#409eff"/>
  <text x="28" y="30" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">肇</text>
  <text x="48" y="31" class="text" font-weight="600">肇新合同管理系统</text>
  <text x="1100" y="31" class="muted">管理员</text>
  <circle cx="1156" cy="26" r="13" fill="#e4e7ed"/>
  <text x="1156" y="31" text-anchor="middle" class="muted">A</text>

  <rect x="0" y="52" width="190" height="648" fill="#304156"/>
  <text x="18" y="80" fill="#8797a6" font-size="11">合同管理</text>
  <text x="22" y="112" class="sidebar-text">合同草拟</text>
  <text x="22" y="148" class="sidebar-text">合同审批</text>
  <rect x="8" y="160" width="174" height="30" rx="4" fill="#263445"/>
  <rect x="8" y="160" width="4" height="30" fill="#409eff"/>
  <text x="22" y="180" class="sidebar-active">模板管理</text>
  <text x="22" y="218" class="sidebar-text">合同台账</text>
  <text x="22" y="254" class="sidebar-text">统计报表</text>

  <rect x="190" y="52" width="1010" height="648" fill="#f5f7fa"/>
  <text x="214" y="82" class="muted">模板管理 / 模板列表</text>

  <!-- Tabs -->
  <rect x="210" y="96" width="966" height="44" rx="6" class="card"/>
  <text x="232" y="123" class="tab">草稿箱</text>
  <text x="322" y="123" class="tab-active">已发布</text>
  <text x="402" y="123" class="tab">已停用</text>
  <line x1="322" y1="128" x2="382" y2="128" stroke="#409eff" stroke-width="2"/>

  <rect x="210" y="156" width="80" height="28" rx="4" fill="#409eff"/>
  <text x="250" y="175" text-anchor="middle" class="btn-text">新建模板</text>
  <rect x="300" y="156" width="66" height="28" rx="4" fill="#fff" stroke="#dcdfe6"/>
  <text x="333" y="175" text-anchor="middle" class="btn-default-text">导入</text>

  <!-- 表格 -->
  <rect x="210" y="196" width="966" height="360" rx="6" class="card"/>
  <rect x="210" y="196" width="966" height="38" rx="6" fill="#fafafa"/>
  <line x1="210" y1="234" x2="1176" y2="234" stroke="#ebeef5"/>
  <text x="226" y="220" class="th">模板名称</text>
  <text x="386" y="220" class="th">模板编码</text>
  <text x="566" y="220" class="th">版本</text>
  <text x="646" y="220" class="th">状态</text>
  <text x="746" y="220" class="th">更新时间</text>
  <text x="916" y="220" class="th">操作</text>

  <text x="226" y="262" class="td">采购合同模板</text>
  <text x="386" y="262" class="td">TPL_CG</text>
  <text x="566" y="262" class="td">v1</text>
  <rect x="646" y="248" width="56" height="20" rx="4" class="tag-pub"/>
  <text x="674" y="262" text-anchor="middle" class="muted">已发布</text>
  <text x="746" y="262" class="td">2026-10-20 10:12</text>
  <text x="916" y="262" class="td" fill="#409eff">停用</text>
  <text x="966" y="262" class="td" fill="#409eff">查看</text>
  <line x1="210" y1="278" x2="1176" y2="278" stroke="#ebeef5"/>

  <text x="226" y="306" class="td">采购合同模板</text>
  <text x="386" y="306" class="td">TPL_CG</text>
  <text x="566" y="306" class="td">v2</text>
  <rect x="646" y="292" width="56" height="20" rx="4" class="tag-draft"/>
  <text x="674" y="306" text-anchor="middle" class="muted">草稿</text>
  <text x="746" y="306" class="td">2026-10-23 15:40</text>
  <text x="916" y="306" class="td" fill="#409eff">发布</text>
  <text x="966" y="306" class="td" fill="#f56c6c">删除</text>
  <line x1="210" y1="322" x2="1176" y2="322" stroke="#ebeef5"/>

  <text x="226" y="350" class="td">服务合同模板</text>
  <text x="386" y="350" class="td">TPL_FW</text>
  <text x="566" y="350" class="td">v1</text>
  <rect x="646" y="336" width="56" height="20" rx="4" class="tag-stop"/>
  <text x="674" y="350" text-anchor="middle" class="muted">已停用</text>
  <text x="746" y="350" class="td">2026-09-18 09:03</text>
  <text x="916" y="350" class="td" fill="#409eff">启用</text>

  <!-- 说明 -->
  <rect x="210" y="576" width="966" height="100" rx="6" fill="#fff" stroke="#e4e7ed"/>
  <text x="226" y="600" class="text" font-weight="600">图例</text>
  <text x="226" y="622" class="muted">同一个模板编码（如 TPL_CG）可以有多条版本记录；发布 v2 时会把 v1 置为「已停用」，保证同一时刻只有一个生效版本。</text>
  <text x="226" y="644" class="muted">草稿箱 → 已发布 → 已停用，是三个列表视图（同一张表按状态筛选），不是三张表。</text>
  <text x="226" y="666" class="muted">模板正文不在库里，存的是文件引用；条款/要素在 template_element 等子表。</text>
</svg>
